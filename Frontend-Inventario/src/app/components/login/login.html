<div class="col-md-12 mt-4">
  <!--Sweet Alert-->
  @if (status === 0) {
    <div class="alert alert-danger mt-3" role="alert">Usuario y/o contraseña incorrectos.</div>
  } @else if (status === 1) {
    <div class="alert alert-warning mt-3" role="alert">
      Error inesperado del servidor. Inténtelo más tarde.
    </div>
  }

  <div class="col-md-4 mx-auto">
    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <h3 class="text-center">Inicio de sesión</h3>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="text"
          class="form-control"
          id="email"
          name="email"
          #email="ngModel"
          [(ngModel)]="user.email"
          required
        />
        @if (!email.valid && email.touched) {
          <small class="invalid-feedback d-block">No puede quedar vacio!</small>
        }
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          #password="ngModel"
          [(ngModel)]="user.password"
          required
        />
        @if (!password.valid && password.touched) {
          <small class="invalid-feedback d-block">No puede quedar vacio!</small>
        }
      </div>
      <div class="d-flex justify-content-between mt-3">
        <input
          class="btn btn-primary"
          type="submit"
          value="Iniciar"
          [disabled]="loginForm.invalid"
        />
        <button [routerLink]="['/home']" type="button" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>
</div>
